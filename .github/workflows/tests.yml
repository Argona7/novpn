name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: unit tests (macOS, Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["system", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: run tests
        run: |
          PY=$([ "${{ matrix.python }}" = system ] && echo /usr/bin/python3 || echo python3)
          $PY --version
          $PY -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff
        run: pipx run ruff check .
      - name: shellcheck
        run: shellcheck install.sh
