</g>
  <text x="176" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-4" fill="#1f2328">novpn</text>
  <text x="76" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#1f2328">Keep the VPN on.</text>
  <text x="76" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">Chosen sites go straight through your ISP.</text>
  <text x="76" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#57606a"><tspan fill="#1a7f37">$</tspan> novpn add ozon.ru</text>

