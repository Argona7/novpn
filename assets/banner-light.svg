<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img"
     aria-label="novpn: keep the VPN on, chosen sites go straight through your ISP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0b0f17" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2da44e" stop-opacity="0.28"/><stop offset="1" stop-color="#2da44e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="418" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <ellipse cx="1100" cy="302" rx="260" ry="140" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="24" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g transform="translate(72 92) scale(1.4375)">
